# Netlify configuration — Personal OS
# Deploys a Vite-built PWA as a static SPA.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# SPA client-side routing: rewrite unknown paths to index.html.
# Placed BEFORE the asset/manifest cache headers so /today, /knowledge etc. hit the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long cache for hashed build assets (Vite outputs to /assets with content hashes).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache the service worker itself — must always fetch fresh so updates ship.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Never cache the manifest — icon/name changes must reach the user on next load.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# Baseline security headers. HTTPS-only enforced by Netlify's Force HTTPS toggle.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
